<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Average & Instantaneous Velocity — Interactive</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
.app{max-width:1000px;margin:auto;padding:22px 16px 42px}h1{font-size:32px;font-weight:500;margin:8px 0}.subtitle{color:#aaa;margin-bottom:20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs button{white-space:nowrap}
button{border:1px solid #383838;background:#171717;color:#eee;border-radius:12px;padding:10px 13px;font-size:14px}button.active{background:#fff;color:#111}
.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:17px;margin-top:14px}
h2{font-size:22px;font-weight:500;margin:0 0 8px}.desc{color:#aaa;line-height:1.5}
canvas{display:block;width:100%;height:330px;background:#050505;border-radius:16px;border:1px solid #292929;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control{background:#171717;border-radius:14px;padding:14px;margin-top:10px}.control label{display:flex;justify-content:space-between;color:#ddd;margin-bottom:8px}.control input[type=range]{width:100%;accent-color:#fff}
.value{font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#171717;border-radius:14px;padding:13px}.small{font-size:12px;color:#999}.big{font-size:22px;font-weight:700;margin-top:4px}
.formula{font-size:18px;background:#0d0d0d;border-radius:12px;padding:13px;margin-top:12px}.note{color:#aaa;font-size:13px;line-height:1.5;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}
@media(max-width:650px){h1{font-size:27px}.grid,.stats{grid-template-columns:1fr}canvas{height:300px}}
</style></head>
<body><div class="app"><h1>Average & Instantaneous Velocity</h1>
<div class="subtitle">Interactive Physics visualisation</div>
<div id="tabs"></div><div id="content"></div></div>
<script>
const topics=[
["rest","Rest & Motion"],["distance","Distance & Displacement"],["speed","Average & Instantaneous Speed"],
["velocity","Average & Instantaneous Velocity"],["accel","Average & Instantaneous Acceleration"],
["straight","Motion in a Straight Line"],["plane","Motion in a Plane"],["projectile","Projectile Motion"],["frame","Change of Frame"]
];
let current="velocity", running=true, time=0,last=performance.now();

const content=document.getElementById("content"),tabs=document.getElementById("tabs");
topics.forEach(([id,name])=>{let b=document.createElement("button");b.textContent=name;b.onclick=()=>{current=id;render();};b.dataset.id=id;tabs.appendChild(b)});

function range(id,label,min,max,step,val){
return `<div class="control"><label><span>${label}</span><span class="value" id="${id}v">${val}</span></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function setupRange(id,fmt=String){let e=document.getElementById(id);if(!e)return null;e.oninput=()=>{document.getElementById(id+"v").textContent=fmt(e.value);draw()};return e}

function render(){
tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===current));
const names=Object.fromEntries(topics);
let title=names[current];
content.innerHTML=`<div class="card"><h2>${title}</h2><div class="desc" id="desc"></div><div id="controls"></div><canvas id="c"></canvas><div id="stats"></div><div id="formula"></div><div class="row"><button id="play">Pause</button><button id="reset">Reset</button></div></div>`;
document.getElementById("desc").textContent=description(current);
document.getElementById("controls").innerHTML=controls(current);
document.getElementById("formula").innerHTML=formula(current);
document.getElementById("play").onclick=()=>{running=!running;document.getElementById("play").textContent=running?"Pause":"Play"};
document.getElementById("reset").onclick=()=>{time=0;render()};
bind(current);draw();
}
function description(id){
return {
rest:"An object is at rest relative to an observer when its position does not change with time. Motion is always relative to a reference point.",
distance:"Distance is the total path length. Displacement is the directed change from initial position to final position.",
speed:"Average speed uses total distance/time. Instantaneous speed is the magnitude of velocity at one instant.",
velocity:"Velocity includes direction. Average velocity is displacement/time; instantaneous velocity is the velocity at a particular instant.",
accel:"Acceleration is the rate of change of velocity. Average acceleration uses Δv/Δt; instantaneous acceleration is the slope of the velocity–time curve.",
straight:"Explore one-dimensional motion with position, velocity and acceleration changing along a straight line.",
plane:"Two-dimensional motion is described with perpendicular x and y components. Projectile motion is a major example.",
projectile:"Launch a ball with an initial speed and angle. Watch its parabolic path and see range, height and flight time change.",
frame:"The same object can have different velocities for different observers. Relative velocity follows v(A/B)=vA−vB."
}[id]}

function controls(id){
if(id==="rest")return range("v","Velocity",0,5,.1,2);
if(id==="distance")return `<div class="grid">${range("path","Path length",1,10,.1,6)}${range("disp","Displacement",0,10,.1,3)}</div>`;
if(id==="speed")return `<div class="grid">${range("dist","Distance",1,20,.1,10)}${range("tt","Time",1,10,.1,5)}</div>`;
if(id==="velocity")return `<div class="grid">${range("dx","Displacement",0,20,.1,10)}${range("tv","Time",1,10,.1,5)}</div>`;
if(id==="accel")return `<div class="grid">${range("vi","Initial velocity",-10,10,.1,2)}${range("vf","Final velocity",-10,10,.1,8)}${range("ta","Time",1,10,.1,3)}</div>`;
if(id==="straight")return `<div class="grid">${range("u","Initial velocity",-5,10,.1,2)}${range("aa","Acceleration",-3,3,.1,1)}${range("ts","Time",0,10,.1,3)}</div>`;
if(id==="plane")return `<div class="grid">${range("vx","x velocity",-5,5,.1,3)}${range("vy","y velocity",-5,5,.1,2)}</div>`;
if(id==="projectile")return `<div class="grid">${range("ps","Initial speed",1,30,.1,15)}${range("ang","Angle",5,85,1,45)}</div>`;
return `<div class="grid">${range("A","Object A velocity",-10,10,.1,4)}${range("B","Object B velocity",-10,10,.1,-2)}</div>`;
}
function formula(id){
let f={
rest:"Position changes with time → motion. Position constant → rest (relative to that observer).",
distance:"Distance ≥ |displacement|",
speed:"Average speed = total distance ÷ total time",
velocity:"Average velocity = displacement ÷ time",
accel:"Average acceleration = (v<sub>f</sub> − v<sub>i</sub>) ÷ Δt",
straight:"x = ut + ½at² &nbsp;&nbsp; | &nbsp;&nbsp; v = u + at",
plane:"r⃗ = x î + y ĵ &nbsp;&nbsp; | &nbsp;&nbsp; v⃗ = v<sub>x</sub>î + v<sub>y</sub>ĵ",
projectile:"x = u cosθ · t &nbsp;&nbsp; | &nbsp;&nbsp; y = u sinθ · t − ½gt²",
frame:"v(A/B) = v(A/G) − v(B/G)"
};return `<div class="formula">${f[id]}</div>`;
}
function bind(id){
["v","path","disp","dist","tt","dx","tv","vi","vf","ta","u","aa","ts","vx","vy","ps","ang","A","B"].forEach(x=>{
let e=document.getElementById(x);if(e){let fmt=x==="ang"?v=>v+"°":v=>v;setupRange(x,fmt)}
});
}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><div class="small">${x[0]}</div><div class="big">${x[1]}</div></div>`).join("")}</div>`}
function draw(){
const c=document.getElementById("c");if(!c)return;const ctx=c.getContext("2d"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
ctx.font="15px Arial";ctx.fillStyle="#ddd";
let id=current;
if(id==="rest"){let v=+g("v"),x=w/2+Math.sin(time*v*.6)*w*.3;obj(ctx,x,h/2-28,"Object", "#4f8df7",v);document.getElementById("stats").innerHTML=stats([["Position","changing"],["Velocity",v.toFixed(1)+" m/s"],["Observation","Ground"]]);}
if(id==="distance"){let path=+g("path"),disp=+g("disp");line(ctx,w,h);let x=w/2+Math.sin(time*.7)*Math.min(path*20,w*.35);obj(ctx,x,h/2-25,"A","#4f8df7",0);document.getElementById("stats").innerHTML=stats([["Distance",path.toFixed(1)+" m"],["Displacement",disp.toFixed(1)+" m"],["Difference",(path-disp).toFixed(1)+" m"]]);}
if(id==="speed"){let D=+g("dist"),T=+g("tt"),s=D/T;let x=(time/T%1)*w*.75+w*.12;line(ctx,w,h);obj(ctx,x,h/2-25,"A","#4f8df7",s);document.getElementById("stats").innerHTML=stats([["Distance",D.toFixed(1)+" m"],["Time",T.toFixed(1)+" s"],["Average speed",s.toFixed(2)+" m/s"]]);}
if(id==="velocity"){let dx=+g("dx"),T=+g("tv"),v=dx/T;let x=w*.15+(time/T%1)*w*.7;line(ctx,w,h);obj(ctx,x,h/2-25,"A","#4f8df7",v);document.getElementById("stats").innerHTML=stats([["Displacement",dx.toFixed(1)+" m"],["Time",T.toFixed(1)+" s"],["Average velocity","+"+v.toFixed(2)+" m/s"]]);}
if(id==="accel"){let vi=+g("vi"),vf=+g("vf"),T=+g("ta"),a=(vf-vi)/T;let frac=(time/T)%1,v=vi+(vf-vi)*frac,x=w/2+v*25;line(ctx,w,h);obj(ctx,x,h/2-25,"A","#4f8df7",v);document.getElementById("stats").innerHTML=stats([["Initial velocity",vi.toFixed(1)+" m/s"],["Final velocity",vf.toFixed(1)+" m/s"],["Average acceleration",a.toFixed(2)+" m/s²"]]);}
if(id==="straight"){let u=+g("u"),a=+g("aa"),t=+g("ts"),tau=(time%Math.max(t,.1));let x0=w*.12,scale=15,x=x0+(u*tau+.5*a*tau*tau)*scale,v=u+a*tau;line(ctx,w,h);obj(ctx,Math.max(30,Math.min(w-30,x)),h/2-25,"A","#4f8df7",v);document.getElementById("stats").innerHTML=stats([["Position x",(u*tau+.5*a*tau*tau).toFixed(2)+" m"],["Velocity",v.toFixed(2)+" m/s"],["Acceleration",a.toFixed(2)+" m/s²"]]);}
if(id==="plane"){let vx=+g("vx"),vy=+g("vy"),x=w/2+Math.sin(time*.7)*vx*35,y=h/2-Math.cos(time*.7)*vy*25;obj(ctx,x,y,"A","#4f8df7",Math.hypot(vx,vy));document.getElementById("stats").innerHTML=stats([["vₓ",vx.toFixed(1)+" m/s"],["vᵧ",vy.toFixed(1)+" m/s"],["Speed",Math.hypot(vx,vy).toFixed(2)+" m/s"]]);}
if(id==="projectile"){let u=+g("ps"),ang=+g("ang")*Math.PI/180,gc=9.8,flight=2*u*Math.sin(ang)/gc,R=u*u*Math.sin(2*ang)/gc,H=u*u*Math.sin(ang)**2/(2*gc);let tau=(time/1.5%1)*flight,xm=u*Math.cos(ang)*tau,ym=u*Math.sin(ang)*tau-.5*gc*tau*tau;let sx=(w*.78/Math.max(R,1)),sy=(h*.72/Math.max(H,1));ctx.strokeStyle="#333";ctx.beginPath();ctx.moveTo(30,h-45);ctx.lineTo(w-25,h-45);ctx.stroke();ctx.strokeStyle="#777";ctx.beginPath();for(let q=0;q<=1;q+=.02){let tt=q*flight,xx=u*Math.cos(ang)*tt,yy=u*Math.sin(ang)*tt-.5*gc*tt*tt;let px=35+xx*sx,py=h-45-yy*sy;if(q===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();obj(ctx,35+xm*sx,h-45-ym*sy,"Ball","#f0b84b",u);document.getElementById("stats").innerHTML=stats([["Range",R.toFixed(2)+" m"],["Max height",H.toFixed(2)+" m"],["Flight time",flight.toFixed(2)+" s"]]);}
if(id==="frame"){let A=+g("A"),B=+g("B"),R=A-B;let y1=h/2-55,y2=h/2+30,x1=w*.25+Math.sin(time*.8)*w*.2,x2=w*.75+Math.sin(time*.8)*w*.2;obj(ctx,x1,y1,"A","#4f8df7",A);obj(ctx,x2,y2,"B","#75c36b",B);document.getElementById("stats").innerHTML=stats([["v(A/G)",A.toFixed(1)+" m/s"],["v(B/G)",B.toFixed(1)+" m/s"],["v(A/B)",R.toFixed(1)+" m/s"]]);}
}
function g(id){return document.getElementById(id)?.value||0}
function line(ctx,w,h){ctx.strokeStyle="#444";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(25,h/2);ctx.lineTo(w-25,h/2);ctx.stroke();for(let x=45;x<w;x+=70){ctx.strokeStyle="#242424";ctx.beginPath();ctx.moveTo(x,h/2-65);ctx.lineTo(x,h/2+65);ctx.stroke()}}
function obj(ctx,x,y,label,color,v){ctx.fillStyle=color;ctx.fillRect(x-32,y,64,48);ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.fillText(label,x-25,y+20);ctx.font="12px Arial";ctx.fillText((v>=0?"+":"")+v.toFixed(1)+" m/s",x-27,y+38);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+60);ctx.lineTo(x+Math.sign(v||1)*38,y+60);ctx.stroke()}
function loop(now){if(running){time+=(now-last)/1000;draw()}last=now;requestAnimationFrame(loop)}
render();requestAnimationFrame(loop);

window.addEventListener("DOMContentLoaded",()=>{const t=document.getElementById("tabs");if(t)t.style.display="none";});
</script></body></html>
